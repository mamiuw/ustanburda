<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ustanburda.ai - Akıllı Araç Arıza Teşhis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Outfit"', 'sans-serif'] },
                    colors: {
                        primary: '#0ea5e9',
                        secondary: '#3b82f6',
                        dark: '#0f172a',
                        surface: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f1f5f9; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        .item-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .item-card:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px -5px rgba(14, 165, 233, 0.25);
            border-color: #0ea5e9;
            background-color: #f0f9ff;
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <nav class="glass-panel sticky top-0 z-50 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="resetApp()">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-secondary to-primary flex items-center justify-center text-white shadow-lg shadow-primary/30">
                    <i class="fa-solid fa-microchip text-xl"></i>
                </div>
                <span class="text-2xl font-extrabold tracking-tight text-dark">
                    ustanburda<span class="text-primary">.ai</span>
                </span>
            </div>
            <!-- Eski etiket kaldırıldı, sade şık bir görünüm bırakıldı -->
            <div class="text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
                <i class="fa-solid fa-wand-magic-sparkles text-primary mr-1"></i> Akıllı Asistan Aktif
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="text-center mb-8 fade-in">
            <h1 class="text-4xl font-extrabold text-dark mb-3">
                Yapay Zeka ile <span class="text-transparent bg-clip-text bg-gradient-to-r from-secondary to-primary">Tam Nokta Atışı</span> Teşhis
            </h1>
            <p class="text-slate-500 text-md max-w-2xl mx-auto font-medium">
                Aracınızı seçin, şikayetinizi yazın veya arıza fotoğrafı yükleyerek anında analiz alın.
            </p>
        </div>

        <div class="glass-panel rounded-2xl p-6 md:p-8 fade-in">
            
            <div class="flex flex-wrap items-center gap-2 mb-6 text-sm font-semibold text-slate-400 pb-4 border-b border-slate-100">
                <button onclick="resetApp()" class="flex items-center gap-2 text-primary hover:text-secondary transition px-4 py-2 bg-sky-50 rounded-lg">
                    <i class="fa-solid fa-car"></i> Marka
                </button>
                <span id="bc-model-wrap" class="hidden flex items-center gap-2">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                    <span class="px-4 py-2 bg-slate-100 rounded-lg text-slate-700" id="bc-brand"></span>
                </span>
                <span id="bc-engine-wrap" class="hidden flex items-center gap-2">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                    <span class="px-4 py-2 bg-slate-100 rounded-lg text-slate-700" id="bc-model"></span>
                </span>
            </div>

            <div id="selection-area">
                <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                    <h2 id="step-title" class="text-xl font-bold text-dark flex items-center gap-2">
                        <i class="fa-solid fa-magnifying-glass text-primary"></i> Marka Seçiniz
                    </h2>
                    <div id="search-container" class="relative w-full sm:w-80">
                        <input type="text" id="searchInput" onkeyup="filterItems()" placeholder="Marka veya model ara..." class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition">
                        <i class="fa-solid fa-search absolute left-4 top-3.5 text-slate-400"></i>
                    </div>
                </div>
                
                <div id="grid-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3 custom-scroll max-h-[65vh] overflow-y-auto p-1">
                    <!-- Dinamik İçerik -->
                </div>
            </div>

            <div id="diagnostic-area" class="hidden fade-in">
                <div class="bg-dark rounded-xl p-6 mb-8 text-white shadow-xl flex justify-between items-center bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">
                    <div>
                        <p class="text-primary text-xs font-bold uppercase tracking-wider mb-2">Seçili Araç Profili</p>
                        <h3 class="text-2xl font-extrabold" id="final-car-name"></h3>
                    </div>
                    <button onclick="resetApp()" class="w-12 h-12 rounded-xl bg-white/10 hover:bg-white/20 flex items-center justify-center transition border border-white/10">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                </div>

                <div class="space-y-5 max-w-4xl mx-auto">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Aracınızdaki Sorun Nedir? (Detaylı Yazın)</label>
                        <textarea id="problemText" rows="4" class="w-full bg-white border-2 border-slate-200 rounded-xl p-4 text-slate-700 focus:ring-0 focus:border-primary transition resize-none text-lg shadow-sm" placeholder="Örn: Aracımın OBD ekranında P0171 kodu verdi, rölantide dalgalanma yapıyor..."></textarea>
                    </div>

                    <!-- FOTOĞRAF / KAMERA YÜKLEME ALANI -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Arıza Fotoğrafı veya Ekran Görüntüsü Ekleyin (İsteğe Bağlı)</label>
                        <div class="flex items-center gap-4">
                            <label class="flex-1 flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-xl p-4 cursor-pointer hover:border-primary hover:bg-sky-50/50 transition bg-white">
                                <i class="fa-solid fa-camera text-primary text-2xl mb-1"></i>
                                <span class="text-xs font-bold text-slate-600" id="file-label-text">Fotoğraf Seç veya Kameradan Çek</span>
                                <input type="file" id="imageInput" accept="image/*" capture="environment" class="hidden" onchange="previewImage(this)">
                            </label>
                            <div id="image-preview-container" class="hidden relative w-24 h-24 border rounded-xl overflow-hidden shadow-sm bg-slate-100 flex items-center justify-center">
                                <img id="imagePreview" class="w-full h-full object-cover">
                                <button onclick="removeImage()" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        </div>
                    </div>
                    
                    <button onclick="analyzeWithAI()" id="ai-btn" class="w-full bg-gradient-to-r from-dark to-slate-800 hover:from-primary hover:to-secondary text-white font-bold text-lg py-4 rounded-xl shadow-lg transition-all duration-300 flex justify-center items-center gap-3">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Yapay Zeka ile Arızayı Çözümle
                    </button>
                </div>
            </div>

            <div id="result-area" class="hidden mt-8 fade-in max-w-4xl mx-auto">
                <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-xl">
                    <div class="bg-slate-50 border-b border-slate-200 px-6 py-4 flex items-center justify-between">
                        <h3 class="font-bold text-dark flex items-center gap-2">
                            <i class="fa-solid fa-file-medical text-primary"></i> Dijital Arıza Raporu
                        </h3>
                    </div>
                    <div id="ai-response" class="p-6 prose prose-slate max-w-none text-slate-700"></div>
                </div>
            </div>

        </div>
    </main>

            "Volkswagen": { models: { "Polo": ["1.0 MPI", "1.0 TSI", "1.2 TSI", "1.4 TDI", "1.6 TDI", "GTI"], "Golf": ["1.0 eTSI", "1.4 TSI", "1.5 eTSI", "1.2 TSI", "1.6 TDI", "2.0 TDI", "GTI", "Golf R 2.0 TSI"], "Passat": ["1.4 TSI", "1.5 TSI", "1.6 TDI", "2.0 TDI", "2.0 TDI 4Motion"], "T-Roc": ["1.5 TSI", "R 2.0 TSI"], "Tiguan": ["1.4 TSI", "1.5 TSI", "2.0 TDI"], "Amarok": ["2.0 TDI", "3.0 V6 TDI"], "Transporter": ["2.0 TDI CtyV", "2.0 TDI LWB"], "Caddy": ["1.6 TDI", "2.0 TDI"] } },
            "Volvo": { models: { "S60": ["B4 AWD", "B5 AWD", "T8 Recharge"], "S90": ["B5 AWD", "B6 AWD", "T8 Recharge PHEV", "D5 AWD"], "V90 Cross Country": ["B5 AWD", "B6 AWD", "D5 AWD"], "XC40": ["T3", "B4 AWD", "Recharge Single Motor", "Recharge Twin Motor"], "XC60": ["B4 AWD", "B5 AWD", "T8 Recharge"], "XC90": ["B5 AWD", "B6 AWD", "T8 Recharge PHEV", "D5 AWD"] } }
        };

        let state = { brand: null, model: null, engine: null, currentList: [], base64Image: null };

        document.addEventListener("DOMContentLoaded", () => {
            state.currentList = Object.keys(carDatabase).sort();
            renderGrid(state.currentList, 'brand');
        });

        function renderGrid(items, type) {
            const grid = document.getElementById('grid-container');
            grid.innerHTML = '';
            
            if(items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400 font-bold">Aradığınız kriterde araç bulunamadı...</div>`;
                return;
            }

            items.forEach(item => {
                grid.innerHTML += `
                    <div onclick="handleSelect('${item.replace(/'/g, "\\'")}', '${type}')" class="item-card bg-white border border-slate-200 rounded-xl p-3 text-center cursor-pointer font-bold text-slate-700 flex flex-col items-center justify-center min-h-[90px] text-sm md:text-base">
                        ${type === 'brand' ? `<div class="w-8 h-8 mb-2 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 border border-slate-100"><i class="fa-solid fa-car"></i></div>` : ''}
                        <span class="${type === 'engine' ? 'text-xs md:text-sm' : ''}">${item}</span>
                    </div>
                `;
            });
        }

        function handleSelect(item, type) {
            const searchInput = document.getElementById('searchInput');
            searchInput.value = '';

            if (type === 'brand') {
                state.brand = item;
                document.getElementById('bc-brand').innerText = item;
                document.getElementById('bc-model-wrap').classList.remove('hidden');
                document.getElementById('step-title').innerHTML = `<i class="fa-solid fa-car text-primary"></i> ${item} Modelleri`;
                state.currentList = Object.keys(carDatabase[item].models).sort();
                renderGrid(state.currentList, 'model');
            } 
            else if (type === 'model') {
                state.model = item;
                document.getElementById('bc-model').innerText = item;
                document.getElementById('bc-engine-wrap').classList.remove('hidden');
                document.getElementById('step-title').innerHTML = `<i class="fa-solid fa-gears text-primary"></i> Motor ve Paket Seçimi`;
                state.currentList = carDatabase[state.brand].models[item];
                renderGrid(state.currentList, 'engine');
            } 
            else if (type === 'engine') {
                state.engine = item;
                document.getElementById('selection-area').classList.add('hidden');
                document.getElementById('diagnostic-area').classList.remove('hidden');
                document.getElementById('final-car-name').innerText = `${state.brand} ${state.model} - ${state.engine}`;
            }
        }

        function filterItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = state.currentList.filter(item => item.toLowerCase().includes(query));
            
            let type = 'brand';
            if(state.brand && !state.model) type = 'model';
            if(state.brand && state.model) type = 'engine';
            
            renderGrid(filtered, type);
        }

        function resetApp() {
            state = { brand: null, model: null, engine: null, currentList: Object.keys(carDatabase).sort(), base64Image: null };
            document.getElementById('selection-area').classList.remove('hidden');
            document.getElementById('diagnostic-area').classList.add('hidden');
            document.getElementById('result-area').classList.add('hidden');
            document.getElementById('bc-model-wrap').classList.add('hidden');
            document.getElementById('bc-engine-wrap').classList.add('hidden');
            document.getElementById('problemText').value = '';
            document.getElementById('searchInput').value = '';
            removeImage();
            document.getElementById('step-title').innerHTML = `<i class="fa-solid fa-magnifying-glass text-primary"></i> Marka Seçiniz`;
            renderGrid(state.currentList, 'brand');
        }

        // FOTOĞRAF ÖNİZLEME VE BASE64 DÖNÜŞTÜRME
        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                    document.getElementById('file-label-text').innerText = "Fotoğraf Yüklendi";
                    // Base64 formatına ayır (data:image/jpeg;base64, kısmını atıp sadece veriyi alıyoruz)
                    state.base64Image = e.target.result.split(',')[1];
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removeImage() {
            document.getElementById('imageInput').value = '';
            document.getElementById('imagePreview').src = '';
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('file-label-text').innerText = "Fotoğraf Seç veya Kameradan Çek";
            state.base64Image = null;
        }

        async function analyzeWithAI() {
            const problem = document.getElementById('problemText').value.trim();
            if (!problem && !state.base64Image) return alert("Lütfen arıza belirtilerini yazın ya da bir fotoğraf yükleyin.");

            const btn = document.getElementById('ai-btn');
            const resultArea = document.getElementById('result-area');
            const responseDiv = document.getElementById('ai-response');
            
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Yapay Zeka Aracı İnceliyor...`;
            btn.disabled = true;
            resultArea.classList.remove('hidden');
            responseDiv.innerHTML = `<div class="flex items-center gap-3 text-secondary font-bold text-lg animate-pulse"><i class="fa-solid fa-microchip"></i> Motor ve Arıza Verileri Analiz Ediliyor...</div>`;

            // GEMİNİ API ANAHTARINI BURAYA YAPIŞTIRACAKSIN
            const API_KEY = "BURAYA_API_KEY_GELECEK"; 
            const fullCar = `${state.brand} ${state.model} ${state.engine}`;
            
            const promptText = `Sen profesyonel bir otomotiv baş ustasısın. Müşteri Aracı: ${fullCar}. Şikayet/Not: ${problem}. 
            Şu yapıya uygun, doğrudan HTML formatında yanıt ver: 
            <h4 style="color:#0ea5e9; font-weight:bold; font-size: 1.1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px;">1) Muhtemel Arıza Sebepleri</h4>
            <h4 style="color:#0ea5e9; font-weight:bold; font-size: 1.1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; margin-top:20px;">2) Çözüm Yolları ve Tamir Süreci</h4>
            <h4 style="color:#0ea5e9; font-weight:bold; font-size: 1.1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; margin-top:20px;">3) Ortalama Türkiye Tamir Maliyeti (TL)</h4>
            Listeleri <ul style="list-style-type: disc; margin-left: 20px; margin-top:10px;"> kullanarak yap.`;

            // Gemini'ye gönderilecek parçalar dizisi (Eğer görsel varsa görseli de ekliyoruz)
            let contentParts = [{ text: promptText }];
            if (state.base64Image) {
                contentParts.push({
                    inline_data: {
                        mime_type: "image/jpeg",
                        data: state.base64Image
                    }
                });
            }

            try {
                // Multimodal (Görsel destekli) gemini-1.5-flash modeli kullanılıyor
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: contentParts }] })
                });
                
                const data = await response.json();
                if(data.candidates && data.candidates[0].content) {
                    responseDiv.innerHTML = data.candidates[0].content.parts[0].text;
                } else if(data.error) {
                    responseDiv.innerHTML = `<span class="text-red-500 font-bold">API Hatası: ${data.error.message}</span>`;
                } else {
                    responseDiv.innerHTML = `<span class="text-red-500 font-bold">API Yanıt Vermedi. API Key'ini kontrol et.</span>`;
                }
            } catch (error) {
                responseDiv.innerHTML = `<span class="text-red-500 font-bold">Bağlantı Hatası! İnternetini veya API anahtarını kontrol et.</span>`;
            } finally {
                btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> Yeni Arıza Tespiti Yap`;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
